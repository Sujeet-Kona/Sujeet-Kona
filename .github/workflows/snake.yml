name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sujeet-Kona
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2339d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Add solid black canvas to SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              svg = re.sub(
                  r'(<svg\b[^>]*>)',
                  r'\1<rect width="100%" height="100%" fill="#000000"/>',
                  svg,
                  count=1,
              )
              path.write_text(svg)
          PY

      - name: Publish snake SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
